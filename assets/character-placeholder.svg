<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 314 664" width="314" height="664" role="img" aria-labelledby="ph-title">
  <title id="ph-title">鲸鱼娘角色占位插画：拱窗、月与鲸尾</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2547"/>
      <stop offset=".55" stop-color="#0A1B33"/>
      <stop offset="1" stop-color="#050F1E"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8FC2F2" stop-opacity=".42"/>
      <stop offset=".45" stop-color="#6FA5DC" stop-opacity=".13"/>
      <stop offset="1" stop-color="#6FA5DC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tail" x1=".35" y1="1" x2=".65" y2="0">
      <stop offset="0" stop-color="#23476E"/>
      <stop offset=".45" stop-color="#4C82BB"/>
      <stop offset=".8" stop-color="#8FC2F2"/>
      <stop offset="1" stop-color="#B7DBFC"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB2E5" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7FB2E5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="314" height="664" fill="url(#bg)"/>
  <circle cx="157" cy="286" r="240" fill="url(#moon)"/>

  <!-- 拱窗 -->
  <path d="M20 664 V240 A137 137 0 0 1 294 240 V664" fill="none" stroke="#C9A24B" stroke-opacity=".5" stroke-width="1"/>
  <path d="M33 664 V252 A124 124 0 0 1 281 252 V664" fill="none" stroke="#C9A24B" stroke-opacity=".16" stroke-width="1"/>

  <!-- 星图 -->
  <g stroke="#C9A24B" stroke-opacity=".38" stroke-width=".7" fill="none">
    <path d="M214 92 L240 126 L276 104 L250 150"/>
    <path d="M100 150 L74 120 L48 138"/>
  </g>
  <g fill="#DCE8F6">
    <circle cx="214" cy="92" r="1.5" opacity=".75"/>
    <circle cx="240" cy="126" r="1.1" opacity=".55"/>
    <circle cx="276" cy="104" r="1.8" opacity=".8"/>
    <circle cx="250" cy="150" r="1" opacity=".5"/>
    <circle cx="100" cy="150" r="1.2" opacity=".5"/>
    <circle cx="74" cy="120" r="1" opacity=".4"/>
    <circle cx="48" cy="138" r="1.3" opacity=".45"/>
    <circle cx="188" cy="70" r="1" opacity=".45"/>
    <circle cx="72" cy="286" r="1.1" opacity=".35"/>
    <circle cx="246" cy="232" r="1" opacity=".4"/>
  </g>
  <g fill="#C9A24B">
    <circle cx="276" cy="104" r="2.2" opacity=".85"/>
    <circle cx="214" cy="92" r="1.8" opacity=".6"/>
    <circle cx="48" cy="138" r="1.6" opacity=".5"/>
  </g>

  <!-- 月环 -->
  <circle cx="157" cy="380" r="150" fill="none" stroke="#C9A24B" stroke-opacity=".16" stroke-width="1"/>
  <circle cx="157" cy="380" r="150" fill="none" stroke="#8FC2F2" stroke-opacity=".07" stroke-width="12"/>

  <!-- 鲸尾：露出水面 -->
  <g>
    <path fill="url(#tail)" fill-opacity=".2" d="M144 456 C142 500 139 550 137 596 C136 606 143 612 152 612 L162 612 C171 612 178 606 177 596 C175 550 172 500 170 456 Z"/>
    <path fill="url(#tail)" fill-opacity=".2" d="M146 440 L168 440 L157 480 Z"/>
    <path fill="url(#tail)" fill-opacity=".2" d="M157 476
      C120 468 82 452 58 432
      C36 414 22 392 20 372
      C18 356 26 346 40 350
      C74 360 106 380 128 404
      C144 428 152 452 157 476 Z"/>
    <path fill="url(#tail)" fill-opacity=".2" d="M157 476
      C194 468 232 452 256 432
      C278 414 292 392 294 372
      C296 356 288 346 274 350
      C240 360 208 380 186 404
      C170 428 162 452 157 476 Z"/>

    <!-- 金线勾边 -->
    <g fill="none" stroke="#E3C27C" stroke-opacity=".78" stroke-width="1.25" stroke-linecap="round">
      <path d="M20 372 C22 392 36 414 58 432 C82 452 120 468 157 476"/>
      <path d="M294 372 C292 392 278 414 256 432 C232 452 194 468 157 476"/>
      <path d="M40 350 C74 360 106 380 128 404 C144 428 152 452 157 476"/>
      <path d="M274 350 C240 360 208 380 186 404 C170 428 162 452 157 476"/>
      <path d="M137 596 C139 550 142 500 144 456"/>
      <path d="M177 596 C175 550 172 500 170 456"/>
    </g>

    <!-- 星点 -->
    <g fill="#F0DEB4">
      <circle cx="26" cy="360" r="1.8" opacity=".8"/>
      <circle cx="288" cy="360" r="1.8" opacity=".8"/>
      <circle cx="157" cy="330" r="1.4" opacity=".55"/>
      <circle cx="96" cy="420" r="1.1" opacity=".45"/>
      <circle cx="218" cy="420" r="1.1" opacity=".45"/>
    </g>
  </g>

  <!-- 水面 -->
  <g fill="none" stroke="url(#water)" stroke-width="1">
    <path d="M0 604 C 60 592 96 610 156 600 C 216 590 252 608 314 596"/>
    <path d="M0 626 C 62 614 98 632 158 622 C 218 612 254 630 314 618"/>
    <path d="M0 648 C 64 636 100 654 160 644 C 220 634 256 652 314 640"/>
  </g>

  <!-- 金色碎点 -->
  <g fill="#C9A24B">
    <circle cx="56" cy="386" r="1.6" opacity=".55"/>
    <circle cx="262" cy="360" r="1.2" opacity=".5"/>
    <circle cx="44" cy="470" r="1.4" opacity=".4"/>
    <circle cx="280" cy="486" r="1.8" opacity=".4"/>
    <circle cx="96" cy="566" r="1.2" opacity=".35"/>
    <circle cx="230" cy="552" r="1.3" opacity=".35"/>
  </g>
</svg>
